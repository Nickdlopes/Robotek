<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotek — Autenticação</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --moss: #3A5A2E; --leaf: #7AAB5E; --leaf2: #A8C88C; --cream: #F5EFE4; --ink: #1A1F14; --ink2: #2C3422; --danger: #A84C32; --muted: rgba(196,168,130,0.5); }
    body { font-family: 'Syne', sans-serif; background: var(--ink); color: var(--cream); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow: hidden; }
    body::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(122,171,94,0.05) 1px, transparent 1px); background-size: 30px 30px; z-index: 0; }
    .login-card { background: var(--ink2); padding: 3rem; border-radius: 4px; border: 1px solid rgba(122,171,94,0.2); width: 100%; max-width: 380px; position: relative; z-index: 1; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--moss), var(--leaf)); }
    .header-logo { font-size: 1.5rem; font-weight: 800; color: var(--leaf2); letter-spacing: 0.15em; text-align: center; margin-bottom: 2.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-family: 'DM Mono', monospace; font-size: 0.65rem; text-transform: uppercase; color: var(--leaf); margin-bottom: 0.5rem; }
    input { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(122,171,94,0.2); padding: 0.8rem; color: var(--cream); font-family: 'DM Mono', monospace; box-sizing: border-box; }
    .btn-action { width: 100%; padding: 1rem; background: var(--moss); color: var(--cream); border: none; font-family: 'DM Mono', monospace; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    .btn-action:hover { background: var(--leaf); }
    .error-msg { color: var(--danger); font-family: 'DM Mono', monospace; font-size: 0.6rem; text-align: center; margin-top: 1rem; display: none; }
    .footer-link { display: block; text-align: center; margin-top: 1.5rem; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--leaf2); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="header-logo">ROBOTEK</div>
    <form id="loginForm">
      <div class="form-group">
        <label>E-mail Operador</label>
        <input type="email" id="email" required placeholder="nick@robotek.com">
      </div>
      <div class="form-group">
        <label>Chave de Acesso</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-action" id="btnLogin">Autenticar</button>
      <div id="error-msg" class="error-msg">Acesso negado: Credenciais inválidas.</div>
      <a href="signin.html" class="footer-link">Não possui conta? Registrar aqui</a>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // SUBSTITUA PELOS SEUS DADOS DO CONSOLE
    const firebaseConfig = {
      apiKey: "AIzaSyAfgkNc7LNpmyJTFD9q1LeuiIqThMhCq1k",
      authDomain: "robotek-senac.firebaseapp.com",
      databaseURL: "https://robotek-senac-default-rtdb.firebaseio.com",
      projectId: "robotek-senac",
      storageBucket: "robotek-senac.firebasestorage.app",
      messagingSenderId: "1035788630207",
      appId: "1:1035788630207:web:f89f12b089be4c7cc1ee0a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('btnLogin');

      btn.innerText = "VERIFICANDO...";
      btn.disabled = true;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const userDoc = await getDoc(doc(db, "usuarios", userCredential.user.uid));
        
        if (userDoc.exists()) {
          localStorage.setItem('user_role', userDoc.data().role);
          window.location.href = 'dash.html';
        }
      } catch (error) {
        errorMsg.style.display = 'block';
        btn.innerText = "AUTENTICAR";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
