<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotek Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    :root {
      --moss:    #3A5A2E;
      --leaf:    #7AAB5E;
      --leaf2:   #A8C88C;
      --cream:   #F5EFE4;
      --ink:     #1A1F14;
      --ink2:    #2C3422;
      --muted:   rgba(196,168,130,0.5);
      --danger:  #A84C32; 
    }

    body { 
      font-family: 'Syne', sans-serif; 
      background: var(--ink); 
      color: var(--cream); 
      margin: 0; 
      padding: 2rem 4.5rem; 
      overflow-x: hidden;
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(122,171,94,0.12); 
      padding-bottom: 15px; 
      margin-bottom: 20px;
    }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--leaf2);
      letter-spacing: 0.12em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--leaf);
      border-radius: 50%;
      animation: breathe 3s ease infinite;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.5); opacity: 0.6; }
    }

    h1 span { 
      font-family: 'DM Mono', monospace;
      font-weight: 300; 
      font-size: 0.5em; 
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-left: 10px;
    }

    #status-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      outline: none;
    }

    .badge-on { 
      color: var(--leaf); 
      background: rgba(122,171,94,0.1);
      border-color: rgba(122,171,94,0.3) !important;
    }
    .badge-on:hover { background: rgba(122,171,94,0.2); }
    
    .badge-off { 
      color: var(--danger); 
      background: rgba(168,76,50,0.1);
      border-color: rgba(168,76,50,0.3) !important;
    }
    .badge-off:hover { background: rgba(168,76,50,0.2); }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
      margin-top: 20px; 
    }

    .card { 
      background: var(--ink2); 
      padding: 1.8rem; 
      border-radius: 2px; 
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--moss), var(--leaf), transparent);
    }

    .card h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .value { 
      font-family: 'Syne', sans-serif;
      font-size: 3.5rem; 
      font-weight: 700; 
      margin: 10px 0; 
      color: var(--leaf2); 
      line-height: 1;
      font-variant-numeric: tabular-nums; 
    }

    /* --- ESTILOS DO CRONÔMETRO EDITÁVEL INLINE --- */
    .timer-editable {
      cursor: text;
      display: inline-block;
      border-bottom: 2px dashed rgba(168,200,140,0.4);
      transition: all 0.2s ease;
      margin: 0;
      outline: none; /* Remove a borda azul padrão do navegador ao focar */
    }
    .timer-editable:focus, .timer-editable:hover { 
      color: #fff !important; 
      border-color: #fff; 
    }
    .timer-editable.running { 
      cursor: default; 
      border-bottom: 2px dashed transparent; 
    }
    .timer-editable.running:focus, .timer-editable.running:hover { 
      color: var(--leaf2) !important; 
      border-color: transparent; 
    }

    .chart-container { 
      background: var(--ink2); 
      margin-top: 30px; 
      padding: 20px; 
      border-radius: 2px;
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      height: 380px; 
      display: flex;
      flex-direction: column;
    }

    .chart-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--moss), var(--leaf), transparent);
    }

    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .chart-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
    .chart-controls { display: flex; gap: 8px; }

    .slider-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }

    .btn-adjust {
      background: rgba(122,171,94,0.1);
      border: 1px solid rgba(122,171,94,0.3);
      color: var(--leaf);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
      font-family: 'DM Mono', monospace;
    }

    .btn-adjust:hover { background: rgba(122,171,94,0.2); transform: scale(1.05); border-color: var(--leaf); }
    .btn-adjust.reset-btn { width: auto; border-radius: 2px; padding: 0 10px; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }

    input[type=range] { -webkit-appearance: none; flex: 1; background: transparent; cursor: pointer; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(122,171,94,0.2); border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb {
      height: 16px; width: 16px; border-radius: 50%; background: var(--leaf); -webkit-appearance: none; margin-top: -6px;
      box-shadow: 0 0 10px rgba(122,171,94,0.4);
    }

    .btn-emergency { 
      font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
      background: transparent; color: var(--danger); border: 1px solid rgba(168,76,50,0.4); 
      padding: 12px 24px; border-radius: 2px; cursor: pointer; font-weight: 500; margin-top: 25px; width: 100%; transition: all 0.3s;
    }
    .btn-emergency:hover { background: rgba(168,76,50,0.1); border-color: var(--danger); }

    .chart-wrapper { position: relative; flex: 1; width: 100%; }

    @media (max-width: 768px) {
      body { padding: 1.5rem; }
      header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      h1 span { display: block; margin-left: 0; margin-top: 5px; }
      #status-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="header-logo">
      <span class="logo-dot"></span>
      ROBOTEK <span>| Controle de Temperatura</span>
    </h1>
    <button id="status-btn" class="badge-off" onclick="toggleSystem()">CARREGANDO...</button>
  </header>

  <div class="grid">
    <div class="card">
      <h3>Temp. Atual</h3>
      <p class="value"><span id="temp-atual">--</span>°C</p>
    </div>

    <div class="card">
      <h3>Setpoint: <span id="setpoint-val" style="color: var(--leaf2); font-family: 'Syne', sans-serif;">--</span>°C</h3>
      <div class="slider-container">
        <button class="btn-adjust" onclick="adjustSetpoint(-0.5)" title="Diminuir 0.5°C">-</button>
        <input type="range" id="setpoint-range" min="20" max="95" step="0.5">
        <button class="btn-adjust" onclick="adjustSetpoint(0.5)" title="Aumentar 0.5°C">+</button>
      </div>
      <button class="btn-emergency" onclick="emergencyStop()">Parada de Emergência</button>
    </div>

    <div class="card">
      <h3>Tempo de Brassagem</h3>
      
      <div style="height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
        <p class="value timer-editable" id="timer-display" contenteditable="false" title="Clique para editar">00:00</p>
      </div>

      <div class="slider-container" style="gap: 8px;">
        <button class="btn-adjust reset-btn" onclick="adjustTimer(-60)" title="Retirar 1 minuto">-1m</button>
        <button class="btn-adjust" id="btn-timer-toggle" onclick="toggleTimer()" title="Iniciar/Pausar">▶</button>
        <button class="btn-adjust reset-btn" onclick="resetTimer()" title="Zerar Cronômetro">Reset</button>
        <button class="btn-adjust reset-btn" onclick="adjustTimer(60)" title="Adicionar 1 minuto">+1m</button>
      </div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Telemetria em Tempo Real</div>
      <div class="chart-controls">
        <button class="btn-adjust reset-btn" onclick="resetChartZoom()" title="Resetar Zoom">Reset</button>
        <button class="btn-adjust" onclick="zoomChartOut()" title="Afastar">-</button>
        <button class="btn-adjust" onclick="zoomChartIn()" title="Aproximar">+</button>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="tempChart"></canvas>
    </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfgkNc7LNpmyJTFD9q1LeuiIqThMhCq1k",
      databaseURL: "https://robotek-senac-default-rtdb.firebaseio.com",
      projectId: "robotek-senac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let systemIsOn = false; 

    // --- LÓGICA DO CRONÔMETRO LOCAL ---
    let timerInterval = null;
    let timeRemaining = 0; 
    let isTimerRunning = false;
    let hasReachedSetpoint = false; 
    const timerDisplay = document.getElementById('timer-display');

    function updateTimerDisplay() {
      // Só atualiza o texto se não estivermos a editar manualmente
      if (document.activeElement !== timerDisplay) {
        let m = Math.floor(timeRemaining / 60);
        let s = timeRemaining % 60;
        timerDisplay.innerText = 
          String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }
    }

    // --- MÁSCARA DE EDIÇÃO INLINE DO CRONÔMETRO ---
    
    // 1. Torna editável ao clicar (se não estiver rodando)
    timerDisplay.addEventListener('click', function() {
      if (!isTimerRunning) {
        this.contentEditable = "true";
        this.focus();
        
        // Coloca o cursor no final do texto
        let range = document.createRange();
        let sel = window.getSelection();
        range.selectNodeContents(this);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });

    // 2. Intercepta a digitação para aplicar a máscara (MM:SS)
    timerDisplay.addEventListener('keydown', function(e) {
      // Permite navegação básica e apagar
      if (['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'].includes(e.key)) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.blur(); // Salva ao apertar Enter
        }
        return;
      }
      
      // Bloqueia teclas não numéricas
      if (!/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        return;
      }

      e.preventDefault(); // Impede o navegador de inserir a tecla diretamente

      // Lógica de "empurrar" os números (Máscara de Micro-ondas)
      let currentText = this.innerText.replace(':', ''); // Pega apenas os números (ex: "0000")
      currentText += e.key; // Adiciona o número digitado no final
      
      // Pega os últimos 4 dígitos
      if (currentText.length > 4) {
        currentText = currentText.slice(-4); 
      } else {
        currentText = currentText.padStart(4, '0'); // Garante que tem 4 dígitos
      }

      // Separa minutos e segundos e atualiza o display temporário
      let m = currentText.slice(0, 2);
      let s = currentText.slice(2, 4);
      this.innerText = m + ':' + s;

      // Mantém o cursor no final
      let range = document.createRange();
      let sel = window.getSelection();
      range.selectNodeContents(this);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    });

    // 3. Salva a edição quando sai do campo (Blur)
    timerDisplay.addEventListener('blur', function() {
      this.contentEditable = "false";
      
      // Lê o que está na tela
      let parts = this.innerText.split(':');
      if (parts.length === 2) {
        let m = parseInt(parts[0]) || 0;
        let s = parseInt(parts[1]) || 0;
        
        // Se segundos for maior que 59, converte corretamente (ex: 1:90 vira 2:30)
        timeRemaining = (m * 60) + s;
      }
      
      hasReachedSetpoint = false; // Rearma o auto-start
      this.style.color = 'var(--leaf2)';
      updateTimerDisplay(); // Força a formatação limpa (MM:SS correto)
    });

    // Previne colar texto maluco no timer
    timerDisplay.addEventListener('paste', (e) => e.preventDefault());


    window.adjustTimer = (seconds) => {
      timeRemaining += seconds;
      if (timeRemaining < 0) timeRemaining = 0;
      document.getElementById('timer-display').style.color = 'var(--leaf2)'; 
      updateTimerDisplay();
      if (!isTimerRunning) { hasReachedSetpoint = false; }
    };

    window.toggleTimer = () => {
      const btn = document.getElementById('btn-timer-toggle');

      if (timeRemaining === 0 && !isTimerRunning) return; 

      isTimerRunning = !isTimerRunning;

      if (isTimerRunning) {
        btn.innerText = '⏸';
        timerDisplay.style.color = 'var(--leaf2)';
        timerDisplay.classList.add('running'); 
        timerDisplay.contentEditable = "false"; // Trava edição

        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            updateTimerDisplay();
          } else {
            isTimerRunning = false;
            btn.innerText = '▶';
            clearInterval(timerInterval);
            timerDisplay.style.color = 'var(--danger)';
            timerDisplay.classList.remove('running');
          }
        }, 1000);
      } else {
        btn.innerText = '▶';
        clearInterval(timerInterval);
        timerDisplay.classList.remove('running'); 
      }
    };

    window.resetTimer = () => {
      isTimerRunning = false;
      hasReachedSetpoint = false; 
      clearInterval(timerInterval);
      
      document.getElementById('btn-timer-toggle').innerText = '▶';
      timerDisplay.style.color = 'var(--leaf2)';
      timerDisplay.classList.remove('running');
      timerDisplay.contentEditable = "false";
      
      timeRemaining = 0;
      updateTimerDisplay();
    };

    // --- CONFIGURAÇÃO DO GRÁFICO (CHART.JS) ---
    const ctx = document.getElementById('tempChart').getContext('2d');
    Chart.defaults.color = 'rgba(196,168,130,0.5)';
    Chart.defaults.font.family = "'DM Mono', monospace";

    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { 
            label: 'Temp. Real', borderColor: '#7AAB5E', backgroundColor: 'rgba(122,171,94,0.1)',
            borderWidth: 2, pointBackgroundColor: '#1A1F14', pointBorderColor: '#7AAB5E',
            data: [], fill: true, tension: 0.4 
          },
          { 
            label: 'Setpoint', borderColor: '#C4A882', borderWidth: 2, borderDash: [5, 5], pointRadius: 0,
            data: [], fill: false, stepped: true 
          }
        ]
      },
      options: { 
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { 
          legend: { labels: { font: { size: 10 } } },
          zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } }
        },
        scales: { 
          y: { min: 20, max: 100, grid: { color: 'rgba(122,171,94,0.05)' } },
          x: { grid: { color: 'rgba(122,171,94,0.05)' } }
        } 
      }
    });

    window.zoomChartIn = () => { tempChart.zoom(1.1); };
    window.zoomChartOut = () => { tempChart.zoom(0.9); };
    window.resetChartZoom = () => { tempChart.resetZoom(); };

    onValue(ref(db, 'robotek/'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById('temp-atual').innerText = data.telemetria.temp_atual;
      document.getElementById('setpoint-val').innerText = data.controle.setpoint;
      document.getElementById('setpoint-range').value = data.controle.setpoint;

      systemIsOn = data.controle.status_sistema;
      const statusBtn = document.getElementById('status-btn');
      statusBtn.innerText = systemIsOn ? "SISTEMA ON" : "SISTEMA OFF";
      statusBtn.className = systemIsOn ? "badge-on" : "badge-off";

      // Gatilho do cronômetro (Margem de ±5°C)
      if (systemIsOn && timeRemaining > 0 && !isTimerRunning) {
        if (Math.abs(data.telemetria.temp_atual - data.controle.setpoint) <= 5) {
          if (!hasReachedSetpoint) {
            hasReachedSetpoint = true; 
            toggleTimer(); 
          }
        }
      }
      
      if (!systemIsOn) {
        hasReachedSetpoint = false;
      }

      const time = new Date().toLocaleTimeString();
      tempChart.data.labels.push(time);
      tempChart.data.datasets[0].data.push(data.telemetria.temp_atual);
      tempChart.data.datasets[1].data.push(data.controle.setpoint);
      
      if (tempChart.data.labels.length > 100) {
        tempChart.data.labels.shift();
        tempChart.data.datasets[0].data.shift();
        tempChart.data.datasets[1].data.shift();
      }
      tempChart.update('none'); 
    });

    window.toggleSystem = () => { update(ref(db, 'robotek/controle'), { status_sistema: !systemIsOn }); };
    document.getElementById('setpoint-range').oninput = (e) => { update(ref(db, 'robotek/controle'), { setpoint: parseFloat(e.target.value) }); };
    window.adjustSetpoint = (delta) => {
      const v = parseFloat(document.getElementById('setpoint-range').value) + delta;
      update(ref(db, 'robotek/controle'), { setpoint: Math.max(20, Math.min(95, v)) });
    };
    window.emergencyStop = () => { update(ref(db, 'robotek/controle'), { status_sistema: false }); };

  </script>
</body>
</html>
