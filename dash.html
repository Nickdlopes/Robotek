<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotek Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    :root {
      --moss:    #3A5A2E;
      --leaf:    #7AAB5E;
      --leaf2:   #A8C88C;
      --cream:   #F5EFE4;
      --ink:     #1A1F14;
      --ink2:    #2C3422;
      --muted:   rgba(196,168,130,0.5);
      --danger:  #A84C32; 
    }

    body { 
      font-family: 'Syne', sans-serif; 
      background: var(--ink); 
      color: var(--cream); 
      margin: 0; 
      padding: 1.5rem 4.5rem; 
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(122,171,94,0.12); 
      padding-bottom: 15px; 
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--leaf2);
      letter-spacing: 0.12em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
    }

    .header-title-main {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      color: var(--cream);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-title-sub {
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      color: var(--cream);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-left: 10px;
      font-size: 0.65em;
    }

    .logo-dot {
      width: 10px; height: 10px;
      background: var(--leaf);
      border-radius: 50%;
      animation: breathe 3s ease infinite;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.5); opacity: 0.6; }
    }

    #status-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      outline: none;
    }

    .badge-on { color: var(--leaf); background: rgba(122,171,94,0.1); border-color: rgba(122,171,94,0.3) !important; }
    .badge-off { color: var(--danger); background: rgba(168,76,50,0.1); border-color: rgba(168,76,50,0.3) !important; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
      margin-top: 10px; 
      flex-shrink: 0;
    }

    .card { 
      background: var(--ink2); 
      padding: 1.8rem; 
      border-radius: 2px; 
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--moss), var(--leaf), transparent);
    }

    .card h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .value { 
      font-family: 'Syne', sans-serif;
      font-size: 3.5rem; 
      font-weight: 700; 
      margin: 10px 0; 
      color: var(--leaf2); 
      line-height: 1;
    }

    .chart-container { 
      background: var(--ink2); 
      margin-top: 25px; 
      padding: 20px; 
      border-radius: 2px;
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      flex-grow: 1; 
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .chart-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
    .chart-controls { display: flex; gap: 8px; }

    .slider-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }

    .btn-adjust {
      background: rgba(122,171,94,0.1);
      border: 1px solid rgba(122,171,94,0.3);
      color: var(--leaf);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
      font-family: 'DM Mono', monospace;
    }

    .btn-adjust:hover { background: rgba(122,171,94,0.2); border-color: var(--leaf); }
    .btn-adjust.reset-btn { width: auto; border-radius: 2px; padding: 0 10px; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }

    input[type=range] { -webkit-appearance: none; flex: 1; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(122,171,94,0.2); border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb {
      height: 16px; width: 16px; border-radius: 50%; background: var(--leaf); -webkit-appearance: none; margin-top: -6px;
    }

    .btn-emergency { 
      font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
      background: transparent; color: var(--danger); border: 1px solid rgba(168,76,50,0.4); 
      padding: 12px 24px; border-radius: 2px; cursor: pointer; font-weight: 500; margin-top: 25px; width: 100%; transition: all 0.3s;
    }

    .esp-disconnected { opacity: 0.3; pointer-events: none !important; filter: grayscale(0.7); }
    .esp-block-container { position: relative; }

    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--danger);
      color: #fff;
      padding: 8px 15px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: bold;
      border-radius: 2px;
      z-index: 1000;
      pointer-events: none;
    }

    a { text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <a href="./index.html">
    <div class="header-logo">
      <span class="logo-dot"></span>
      <span class="header-title-main">ROBOTEK</span> | <span class="header-title-sub">CONTROLE DE TEMPERATURA</span>
    </div>
    </a>
    <div class="esp-block-container" id="status-btn-container">
      <button id="status-btn" class="badge-off" onclick="toggleSystem()">CARREGANDO...</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h3>Temp. Atual</h3>
      <p class="value"><span id="temp-atual">--</span>°C</p>
    </div>

    <div class="card">
      <h3>Setpoint: <span id="setpoint-val" style="color: var(--leaf2); font-family: 'Syne', sans-serif;">--</span>°C</h3>
      <div class="esp-block-container" id="setpoint-controls">
        <div class="slider-container">
          <button class="btn-adjust" onclick="adjustSetpoint(-0.5)">-</button>
          <input type="range" id="setpoint-range" min="20" max="130" step="0.5">
          <button class="btn-adjust" onclick="adjustSetpoint(0.5)">+</button>
        </div>
        <button class="btn-emergency" onclick="emergencyStop()">Parada de Emergência</button>
      </div>
    </div>

    <div class="card">
      <h3>Tempo de Brassagem</h3>
      <div class="esp-block-container" id="timer-controls">
        <div style="height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <p class="value" id="timer-display">00:00</p>
        </div>
        <div class="slider-container" style="gap: 8px;">
          <button class="btn-adjust reset-btn" onclick="adjustTimerFirebase(-60000)">-1m</button>
          <button class="btn-adjust" id="btn-timer-toggle" onclick="toggleTimerFirebase()">▶</button>
          <button class="btn-adjust reset-btn" onclick="resetTimerFirebase()">Reset</button>
          <button class="btn-adjust reset-btn" onclick="adjustTimerFirebase(60000)">+1m</button>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Telemetria em Tempo Real</div>
      <div class="chart-controls">
        <button class="btn-adjust reset-btn" onclick="resetChartZoom()">Reset</button>
        <button class="btn-adjust" onclick="zoomChartOut()">-</button>
        <button class="btn-adjust" onclick="zoomChartIn()">+</button>
      </div>
    </div>
    <div style="flex-grow: 1; min-height: 0;">
      <canvas id="tempChart"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    if (sessionStorage.getItem('robotek_auth') !== 'true') {
      window.location.href = 'login.html';
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAfgkNc7LNpmyJTFD9q1LeuiIqThMhCq1k",
      databaseURL: "https://robotek-senac-default-rtdb.firebaseio.com",
      projectId: "robotek-senac"
    };

    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwc1RY0MJYVqsN5xO4NATDH4zF4zwO_Xj_EWA8arTmnJTBZsR54aGp_9PPIihXVXdzhOQ/exec";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let systemIsOn = false, lastUpdateTimestamp = 0, espConnected = false, globalTimerRunning = false, globalTimerTarget = 0; 
    const timerDisplay = document.getElementById('timer-display'), btnToggle = document.getElementById('btn-timer-toggle');

    const ctx = document.getElementById('tempChart').getContext('2d');
    Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(0, 0, 0, 0.9)';
    Chart.defaults.plugins.tooltip.titleFont = { family: 'Syne', size: 14 };
    Chart.defaults.plugins.tooltip.bodyFont = { family: 'Syne', size: 13 };

    const tempChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [
        { label: 'Temp. Real', borderColor: '#7AAB5E', data: [], fill: false, tension: 0.1, pointRadius: 2, pointBackgroundColor: '#7AAB5E' },
        { label: 'Setpoint', borderColor: '#C4A882', borderDash: [5,5], data: [], stepped: true, pointRadius: 0 }
      ]},
      options: { 
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, labels: { color: 'rgba(196,168,130,0.8)', font: { family: 'DM Mono', size: 10 } } },
          tooltip: {
             callbacks: {
               title: (items) => "25/04 - " + items[0].label
             }
          },
          zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } }
        },
        scales: { 
          y: { min: 20, max: 130, grid: { color: 'rgba(122,171,94,0.05)' }, ticks: { color: 'rgba(196,168,130,0.5)', font: { family: 'DM Mono', size: 10 } } },
          x: { grid: { display: false }, ticks: { color: 'rgba(196,168,130,0.5)', font: { family: 'DM Mono', size: 9 } } }
        } 
      },
      plugins: [{
        id: 'hoverLineX',
        afterDraw: (chart) => {
          if (chart.tooltip?._active?.length) {
            const {ctx, chartArea: {top, bottom}} = chart;
            const activePoint = chart.tooltip._active[0];
            const x = activePoint.element.x;
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(x, top);
            ctx.lineTo(x, bottom);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(122, 171, 94, 0.4)';
            ctx.stroke();
            ctx.restore();
          }
        }
      }]
    });

    window.zoomChartIn = () => tempChart.zoom(1.1);
    window.zoomChartOut = () => tempChart.zoom(0.9);
    window.resetChartZoom = () => tempChart.resetZoom();

    window.processSheetHistory = function(history) {
      if (espConnected) return;
      tempChart.data.labels = []; tempChart.data.datasets[0].data = []; tempChart.data.datasets[1].data = [];
      history.forEach(ponto => {
        const match = ponto.hora.toString().match(/(\d{2}:\d{2})/);
        tempChart.data.labels.push(match ? match[1] : "00:00"); 
        tempChart.data.datasets[0].data.push(ponto.temp_atual);
        tempChart.data.datasets[1].data.push(ponto.setpoint);
      });
      const ultimo = history[history.length - 1];
      document.getElementById('temp-atual').innerText = ultimo.temp_atual;
      document.getElementById('setpoint-val').innerText = ultimo.setpoint;
      tempChart.update('none');
    };

    function fetchSheetData() {
      if (espConnected) return;
      const oldScript = document.getElementById('jsonp-sheet');
      if (oldScript) oldScript.remove();
      const script = document.createElement('script');
      script.id = 'jsonp-sheet';
      script.src = `${SHEET_API_URL}?callback=processSheetHistory&nocache=${Date.now()}`;
      document.body.appendChild(script);
    }

    setInterval(() => {
      const now = Date.now();
      espConnected = (now - lastUpdateTimestamp < 2000);
      const containers = [document.getElementById('status-btn-container'), document.getElementById('setpoint-controls'), document.getElementById('timer-controls')];
      containers.forEach(container => {
        if (!espConnected) { container.classList.add('esp-disconnected'); container.setAttribute('data-tooltip', 'COMANDO INATIVO'); }
        else { container.classList.remove('esp-disconnected'); container.removeAttribute('data-tooltip'); }
      });
      if (!espConnected && (now % 10000 < 2000)) fetchSheetData();
    }, 2000);

    onValue(ref(db, 'robotek/'), (snapshot) => {
      const data = snapshot.val(); if (!data) return;
      lastUpdateTimestamp = Date.now(); 
      const tel = data.telemetria || {}, ctrl = data.controle || {};
      document.getElementById('temp-atual').innerText = tel.temp_atual || 0;
      document.getElementById('setpoint-val').innerText = ctrl.setpoint || 20;
      document.getElementById('setpoint-range').value = ctrl.setpoint || 20;
      systemIsOn = ctrl.status_sistema || false;
      const statusBtn = document.getElementById('status-btn');
      statusBtn.innerText = systemIsOn ? "SISTEMA ON" : "SISTEMA OFF";
      statusBtn.className = systemIsOn ? "badge-on" : "badge-off";
      globalTimerRunning = ctrl.timer_running || false;
      globalTimerTarget = ctrl.timer_target || 0;
      const time = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
      tempChart.data.labels.push(time);
      tempChart.data.datasets[0].data.push(tel.temp_atual || 0);
      tempChart.data.datasets[1].data.push(ctrl.setpoint || 20);
      if (tempChart.data.labels.length > 50) { tempChart.data.labels.shift(); tempChart.data.datasets.forEach(ds => ds.data.shift()); }
      tempChart.update('none');
    });

    // Funções Firebase mantidas
    window.toggleSystem = () => { update(ref(db, 'robotek/controle'), { status_sistema: !systemIsOn }); };
    window.adjustSetpoint = (delta) => { const v = parseFloat(document.getElementById('setpoint-range').value) + delta; update(ref(db, 'robotek/controle'), { setpoint: Math.max(20, Math.min(130, v)) }); };
    window.emergencyStop = () => { update(ref(db, 'robotek/controle'), { status_sistema: false, timer_running: false }); };
    window.toggleTimerFirebase = () => { if (!globalTimerRunning) update(ref(db, 'robotek/controle'), { timer_running: true, timer_target: Date.now() + globalTimerTarget }); else update(ref(db, 'robotek/controle'), { timer_running: false, timer_target: globalTimerTarget - Date.now() }); };
    window.adjustTimerFirebase = (ms) => { update(ref(db, 'robotek/controle'), { timer_target: Math.max(0, globalTimerTarget + ms) }); };
    window.resetTimerFirebase = () => { update(ref(db, 'robotek/controle'), { timer_running: false, timer_target: 0 }); };
  </script>
</body>
</html>
