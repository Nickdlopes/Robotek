<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotek — Acesso Restrito</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss:    #3A5A2E;
      --leaf:    #7AAB5E;
      --leaf2:   #A8C88C;
      --cream:   #F5EFE4;
      --ink:     #1A1F14;
      --ink2:    #2C3422;
      --muted:   rgba(196,168,130,0.5);
      --danger:  #A84C32;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--ink);
      color: var(--cream);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }

    /* Efeito de grade ao fundo */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(122,171,94,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
    }

    .login-card {
      background: var(--ink2);
      padding: 3rem;
      border-radius: 4px;
      border: 1px solid rgba(122,171,94,0.2);
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--moss), var(--leaf));
    }

    .header-logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--leaf2);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .header-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 2.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--leaf);
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(122,171,94,0.2);
      padding: 0.8rem;
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      border-radius: 2px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--leaf);
      background: rgba(0, 0, 0, 0.5);
    }

    .btn-login {
      width: 100%;
      padding: 1rem;
      background: var(--moss);
      color: var(--cream);
      border: none;
      font-family: 'DM Mono', monospace;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      background: var(--leaf);
      transform: translateY(-2px);
    }

    .error-msg {
      color: var(--danger);
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .footer-copy {
      position: absolute;
      bottom: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.5rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header-logo">ROBOTEK</div>
    <div class="header-sub">Brewery Control Unit</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Operador</label>
        <input type="text" id="username" placeholder="Seu usuário" required>
      </div>
      <div class="form-group">
        <label for="password">Chave de Acesso</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn-login">Autenticar</button>
      <div id="error-msg" class="error-msg">Acesso negado: Credenciais inválidas.</div>
    </form>
  </div>

  <div class="footer-copy">© 2026 Robotek OS v2.4.1</div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if ((user.toLowerCase() === 'admin' || user.toLowerCase() === 'nick') && pass === 'admin@123') {
        // Salva na sessão do navegador que o usuário está logado
        sessionStorage.setItem('robotek_auth', 'true');
        window.location.href = 'dash.html';
      } else {
        errorMsg.style.display = 'block';
        // Feedback visual de erro (tremidinha)
        loginForm.classList.add('shake');
        setTimeout(() => loginForm.classList.remove('shake'), 500);
      }
    });
  </script>

</body>
</html>
