<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotek Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    :root {
      --moss:    #3A5A2E;
      --leaf:    #7AAB5E;
      --leaf2:   #A8C88C;
      --cream:   #F5EFE4;
      --ink:     #1A1F14;
      --ink2:    #2C3422;
      --muted:   rgba(196,168,130,0.5);
      --danger:  #A84C32; 
    }

    body { 
      font-family: 'Syne', sans-serif; 
      background: var(--ink); 
      color: var(--cream); 
      margin: 0; 
      padding: 2rem 4.5rem; 
      overflow-x: hidden;
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(122,171,94,0.12); 
      padding-bottom: 15px; 
      margin-bottom: 20px;
    }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--leaf2);
      letter-spacing: 0.12em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--leaf);
      border-radius: 50%;
      animation: breathe 3s ease infinite;
    }
    
    .logo-dot.offline {
      background: var(--danger);
      animation: none;
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.5); opacity: 0.6; }
    }

    h1 span { 
      font-family: 'DM Mono', monospace;
      font-weight: 300; 
      font-size: 0.5em; 
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-left: 10px;
    }

    #esp-status-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      margin-left: 15px;
      padding: 4px 8px;
      border-radius: 2px;
      background: rgba(168,76,50,0.1);
      color: var(--danger);
      border: 1px solid rgba(168,76,50,0.3);
      transition: all 0.3s ease;
    }

    #esp-status-text.online {
      background: rgba(122,171,94,0.1);
      color: var(--leaf);
      border-color: rgba(122,171,94,0.3);
    }

    #status-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      outline: none;
    }

    .badge-on { 
      color: var(--leaf); 
      background: rgba(122,171,94,0.1);
      border-color: rgba(122,171,94,0.3) !important;
    }
    .badge-on:hover { background: rgba(122,171,94,0.2); }
    
    .badge-off { 
      color: var(--danger); 
      background: rgba(168,76,50,0.1);
      border-color: rgba(168,76,50,0.3) !important;
    }
    .badge-off:hover { background: rgba(168,76,50,0.2); }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
      margin-top: 20px; 
    }

    .card { 
      background: var(--ink2); 
      padding: 1.8rem; 
      border-radius: 2px; 
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--moss), var(--leaf), transparent);
    }

    .card h3 {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .value { 
      font-family: 'Syne', sans-serif;
      font-size: 3.5rem; 
      font-weight: 700; 
      margin: 10px 0; 
      color: var(--leaf2); 
      line-height: 1;
      font-variant-numeric: tabular-nums; 
    }

    .timer-editable {
      cursor: text;
      display: inline-block;
      border-bottom: 2px dashed rgba(168,200,140,0.4);
      transition: all 0.2s ease;
      margin: 0;
      outline: none;
    }
    .timer-editable:focus, .timer-editable:hover { 
      color: #fff !important; 
      border-color: #fff; 
    }
    .timer-editable.running { 
      cursor: default; 
      border-bottom: 2px dashed transparent; 
    }
    .timer-editable.running:focus, .timer-editable.running:hover { 
      color: var(--leaf2) !important; 
      border-color: transparent; 
    }

    .sys-ctrl:disabled {
      opacity: 0.3 !important;
      cursor: not-allowed !important;
      pointer-events: none;
      filter: grayscale(100%);
    }

    .timer-editable.disabled-timer {
      opacity: 0.4;
      pointer-events: none;
      border-bottom-color: transparent;
    }

    .chart-container { 
      background: var(--ink2); 
      margin-top: 30px; 
      padding: 20px; 
      border-radius: 2px;
      border: 1px solid rgba(122,171,94,0.2);
      position: relative;
      height: 480px; 
      display: flex;
      flex-direction: column;
    }

    .chart-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--moss), var(--leaf), transparent);
    }

    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .chart-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
    .chart-controls { display: flex; gap: 8px; }

    .slider-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; }

    .btn-adjust {
      background: rgba(122,171,94,0.1);
      border: 1px solid rgba(122,171,94,0.3);
      color: var(--leaf);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
      font-family: 'DM Mono', monospace;
    }

    .btn-adjust:hover:not(:disabled) { background: rgba(122,171,94,0.2); transform: scale(1.05); border-color: var(--leaf); }
    .btn-adjust.reset-btn { width: auto; border-radius: 2px; padding: 0 10px; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }

    input[type=range] { -webkit-appearance: none; flex: 1; background: transparent; cursor: pointer; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(122,171,94,0.2); border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb {
      height: 16px; width: 16px; border-radius: 50%; background: var(--leaf); -webkit-appearance: none; margin-top: -6px;
      box-shadow: 0 0 10px rgba(122,171,94,0.4);
    }

    .btn-emergency { 
      font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase;
      background: transparent; color: var(--danger); border: 1px solid rgba(168,76,50,0.4); 
      padding: 12px 24px; border-radius: 2px; cursor: pointer; font-weight: 500; margin-top: 25px; width: 100%; transition: all 0.3s;
    }
    .btn-emergency:hover:not(:disabled) { background: rgba(168,76,50,0.1); border-color: var(--danger); }

    .chart-wrapper { position: relative; flex: 1; width: 100%; }

    @media (max-width: 768px) {
      body { padding: 1.5rem; }
      header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      h1 span { display: block; margin-left: 0; margin-top: 5px; }
      #esp-status-text { margin-left: 0; margin-top: 10px; display: inline-block; }
      #status-btn { width: 100%; text-align: center; }
    }

    a { text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; flex-wrap: wrap;">
      <a href="./index.html" style="display: flex; align-items: center; text-decoration: none;">
        <h1 class="header-logo">
          <span class="logo-dot offline" id="logo-indicator"></span>
          ROBOTEK <span>| Controle de Temperatura</span>
        </h1>
      </a>
      <span id="esp-status-text">🔴 ESP OFFLINE</span>
    </div>
    <button id="status-btn" class="badge-off sys-ctrl" onclick="toggleSystem()" disabled>SISTEMA OFF</button>
  </header>

  <div class="grid">
    <div class="card">
      <h3>Temp. Atual</h3>
      <p class="value"><span id="temp-atual">--</span>°C</p>
    </div>

    <div class="card">
      <h3>Setpoint: <span id="setpoint-val" style="color: var(--leaf2); font-family: 'Syne', sans-serif;">--</span>°C</h3>
      <div class="slider-container">
        <button class="btn-adjust sys-ctrl" onclick="adjustSetpoint(-0.5)" title="Diminuir 0.5°C" disabled>-</button>
        <input type="range" id="setpoint-range" class="sys-ctrl" min="20" max="95" step="0.5" disabled>
        <button class="btn-adjust sys-ctrl" onclick="adjustSetpoint(0.5)" title="Aumentar 0.5°C" disabled>+</button>
      </div>
      <button class="btn-emergency sys-ctrl" onclick="emergencyStop()" disabled>Parada de Emergência</button>
    </div>

    <div class="card">
      <h3>Tempo de Brassagem</h3>
      <div style="height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
        <p class="value timer-editable disabled-timer" id="timer-display" contenteditable="false" title="Clique para editar">00:00</p>
      </div>
      <div class="slider-container" style="gap: 8px;">
        <button class="btn-adjust reset-btn sys-ctrl" onclick="adjustTimerFirebase(-60000)" title="Retirar 1 minuto" disabled>-1m</button>
        <button class="btn-adjust sys-ctrl" id="btn-timer-toggle" onclick="toggleTimerFirebase()" title="Iniciar/Pausar" disabled>▶</button>
        <button class="btn-adjust reset-btn sys-ctrl" onclick="resetTimerFirebase()" title="Zerar Cronômetro" disabled>Reset</button>
        <button class="btn-adjust reset-btn sys-ctrl" onclick="adjustTimerFirebase(60000)" title="Adicionar 1 minuto" disabled>+1m</button>
      </div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Telemetria em Tempo Real (Histórico)</div>
      <div class="chart-controls">
        <button class="btn-adjust reset-btn" onclick="resetChartZoom()" title="Resetar Zoom">Reset</button>
        <button class="btn-adjust" onclick="zoomChartOut()" title="Afastar">-</button>
        <button class="btn-adjust" onclick="zoomChartIn()" title="Aproximar">+</button>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="tempChart"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    if (sessionStorage.getItem('robotek_auth') !== 'true') {
      // window.location.href = 'login.html'; // Descomente para produção
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAfgkNc7LNpmyJTFD9q1LeuiIqThMhCq1k",
      databaseURL: "https://robotek-senac-default-rtdb.firebaseio.com",
      projectId: "robotek-senac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let systemIsOn = false; 
    let hasReachedSetpoint = false; 
    let isEspConnected = false; 

    let tempAtualGlobal = 0;
    let setpointGlobal = 20;

    let globalTimerRunning = false;
    let globalTimerTarget = 0; 
    let localRemainingMs = 0; 
    let visualUpdateInterval = null;
    
    const timerDisplay = document.getElementById('timer-display');
    const btnToggle = document.getElementById('btn-timer-toggle');

    function setControlsState(active) {
      if (isEspConnected === active) return; 
      isEspConnected = active;

      const indicatorDot = document.getElementById('logo-indicator');
      const statusText = document.getElementById('esp-status-text');
      
      if (active) {
        indicatorDot.classList.remove('offline');
        statusText.classList.add('online');
        statusText.innerText = "🟢 ESP ONLINE";
      } else {
        indicatorDot.classList.add('offline');
        statusText.classList.remove('online');
        statusText.innerText = "🔴 ESP OFFLINE";
      }

      document.querySelectorAll('.sys-ctrl').forEach(el => { el.disabled = !active; });

      if (active) {
        timerDisplay.classList.remove('disabled-timer');
      } else {
        timerDisplay.classList.add('disabled-timer');
        timerDisplay.contentEditable = "false";
      }
    }

    function formatTime(ms) {
      if (ms < 0) ms = 0;
      let totalSeconds = Math.floor(ms / 1000);
      let m = Math.floor(totalSeconds / 60);
      let s = totalSeconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    let alertFired = false;

    function playAlarm() {
      const context = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 10; i++) {
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.connect(gain);
        gain.connect(context.destination);
        osc.type = "sine";
        osc.frequency.value = 880; 
        let startTime = context.currentTime + i;
        let stopTime = startTime + 0.5;
        osc.start(startTime);
        osc.stop(stopTime);
        gain.gain.setValueAtTime(0.5, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, stopTime);
      }
    }

    function renderTimerVisuals() {
      if (!timerDisplay || !btnToggle) return;

      if (!globalTimerRunning) {
        if (document.activeElement !== timerDisplay) {
          timerDisplay.innerText = formatTime(globalTimerTarget); 
        }
        timerDisplay.style.color = 'var(--leaf2)';
        timerDisplay.classList.remove('running');
        btnToggle.innerText = '▶';
        if(isEspConnected) timerDisplay.contentEditable = "false"; 
        alertFired = false; 
      } else {
        let now = Date.now();
        localRemainingMs = globalTimerTarget - now;
        
        if (localRemainingMs > 0) {
          timerDisplay.innerText = formatTime(localRemainingMs);
          timerDisplay.style.color = 'var(--leaf2)';
          timerDisplay.classList.add('running');
          btnToggle.innerText = '⏸';
          timerDisplay.contentEditable = "false";
        } else {
          timerDisplay.innerText = "00:00";
          timerDisplay.style.color = 'var(--danger)';
          timerDisplay.classList.remove('running');
          btnToggle.innerText = '▶';
          
          if (globalTimerRunning) {
             update(ref(db, 'robotek/controle'), { timer_running: false, timer_target: 0, status_sistema: false });
             if (!alertFired) {
                alertFired = true;
                playAlarm(); 
                setTimeout(() => { alert("🚨 Tempo esgotado! O sistema foi desligado. 🚨"); }, 50);
             }
          }
        }
      }
    }

    if (!visualUpdateInterval) {
      visualUpdateInterval = setInterval(() => {
        if (globalTimerRunning) renderTimerVisuals();
      }, 500); 
    }

    const sheetId = '1we4gmrFL36z9yvANcGpXFK_owxuDLn_c6gs0isR7uvg';
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=0`;

    async function fetchSheetData() {
      try {
        const response = await fetch(sheetUrl);
        const text = await response.text();
        const rows = text.trim().split('\n').map(row => row.split(','));
        
        const validRows = rows.filter(r => r.length >= 3 && r[0] !== "" && !r[0].includes("HORA"));
        
        if (validRows.length > 0) { 
          let novasLabels = [];
          let novaTempReal = [];
          let novoSetpoint = [];

          validRows.forEach(row => {
            const horaStr = row[0].replace(/"/g, '');
            const tempVal = parseFloat(row[1].replace(/"/g, ''));
            const tempSetVal = parseFloat(row[2].replace(/"/g, ''));

            if (!isNaN(tempVal) && !isNaN(tempSetVal)) {
              novasLabels.push(horaStr);
              novaTempReal.push(tempVal);
              novoSetpoint.push(tempSetVal);
            }
          });

          if (novasLabels.length > 0) {
            tempAtualGlobal = novaTempReal[novaTempReal.length - 1];
            setpointGlobal = novoSetpoint[novoSetpoint.length - 1];

            document.getElementById('temp-atual').innerText = tempAtualGlobal;
            document.getElementById('setpoint-val').innerText = setpointGlobal;
            if(document.activeElement !== document.getElementById('setpoint-range')) {
               document.getElementById('setpoint-range').value = setpointGlobal;
            }

            tempChart.data.labels = novasLabels;
            tempChart.data.datasets[0].data = novaTempReal;
            tempChart.data.datasets[1].data = novoSetpoint;
            
            tempChart.update('none');
          }
        }
      } catch (error) {
        console.error("Erro ao buscar dados da planilha:", error);
      }
    }

    setInterval(fetchSheetData, 5000);
    fetchSheetData();

    window.toggleTimerFirebase = () => {
      if (!isEspConnected || (globalTimerTarget === 0 && !globalTimerRunning)) return; 
      if (!globalTimerRunning) {
        let newTarget = Date.now() + globalTimerTarget;
        update(ref(db, 'robotek/controle'), { timer_running: true, timer_target: newTarget });
      } else {
        let timeLeft = globalTimerTarget - Date.now();
        if (timeLeft < 0) timeLeft = 0;
        update(ref(db, 'robotek/controle'), { timer_running: false, timer_target: timeLeft });
      }
    };

    window.adjustTimerFirebase = (msToAddOrRemove) => {
      if (!isEspConnected) return;
      if (!globalTimerRunning) {
        let novoTempo = globalTimerTarget + msToAddOrRemove;
        if (novoTempo < 0) novoTempo = 0;
        update(ref(db, 'robotek/controle'), { timer_target: novoTempo });
      } else {
        let novoTarget = globalTimerTarget + msToAddOrRemove;
        if (novoTarget < Date.now()) novoTarget = Date.now();
        update(ref(db, 'robotek/controle'), { timer_target: novoTarget });
      }
    };

    window.resetTimerFirebase = () => {
      if (!isEspConnected) return;
      hasReachedSetpoint = false; 
      update(ref(db, 'robotek/controle'), { timer_running: false, timer_target: 0 });
    };

    timerDisplay.addEventListener('click', function() {
      if (!globalTimerRunning && isEspConnected) {
        this.contentEditable = "true";
        this.focus();
        let range = document.createRange();
        let sel = window.getSelection();
        range.selectNodeContents(this);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });

    timerDisplay.addEventListener('keydown', function(e) {
      if (['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'].includes(e.key)) {
        if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
        return;
      }
      if (!/^[0-9]$/.test(e.key)) { e.preventDefault(); return; }
      e.preventDefault();
      let currentText = this.innerText.replace(':', ''); 
      currentText += e.key; 
      if (currentText.length > 4) currentText = currentText.slice(-4); 
      else currentText = currentText.padStart(4, '0'); 
      let m = currentText.slice(0, 2);
      let s = currentText.slice(2, 4);
      this.innerText = m + ':' + s;
      let range = document.createRange();
      let sel = window.getSelection();
      range.selectNodeContents(this);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    });

    timerDisplay.addEventListener('blur', function() {
      if (!isEspConnected) return;
      this.contentEditable = "false";
      let parts = this.innerText.split(':');
      if (parts.length === 2) {
        let m = parseInt(parts[0]) || 0;
        let s = parseInt(parts[1]) || 0;
        let totalMs = ((m * 60) + s) * 1000;
        hasReachedSetpoint = false; 
        update(ref(db, 'robotek/controle'), { timer_target: totalMs });
      }
    });

    timerDisplay.addEventListener('paste', (e) => e.preventDefault());

    // --- NOVO PLUGIN: LINHA VERTICAL NO HOVER ---
    const verticalHoverLine = {
      id: 'verticalHoverLine',
      beforeDraw: chart => {
        if (chart.tooltip._active && chart.tooltip._active.length) {
          const ctx = chart.ctx;
          const activePoint = chart.tooltip._active[0];
          const x = activePoint.element.x;
          const topY = chart.scales.y.top;
          const bottomY = chart.scales.y.bottom;

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(x, topY);
          ctx.lineTo(x, bottomY);
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(122, 171, 94, 0.4)'; // Verde suave transparente
          ctx.setLineDash([5, 5]);
          ctx.stroke();
          ctx.restore();
        }
      }
    };

    const ctx = document.getElementById('tempChart').getContext('2d');
    Chart.defaults.color = 'rgba(196,168,130,0.5)';
    Chart.defaults.font.family = "'DM Mono', monospace";

    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Temp. Real', borderColor: '#7AAB5E', backgroundColor: 'rgba(122,171,94,0.1)', borderWidth: 2, pointBackgroundColor: '#1A1F14', pointBorderColor: '#7AAB5E', data: [], fill: true, tension: 0.4, pointRadius: 1 },
          { label: 'Setpoint', borderColor: '#C4A882', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, data: [], fill: false, stepped: true }
        ]
      },
      options: { 
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { 
          legend: { labels: { font: { size: 10 } } },
          zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } }
        },
        scales: { 
          y: { min: 20, max: 130, grid: { color: 'rgba(122,171,94,0.05)' } },
          x: { grid: { color: 'rgba(122,171,94,0.05)' }, ticks: { maxTicksLimit: 15 } }
        } 
      },
      plugins: [verticalHoverLine] // <-- Plugin adicionado aqui
    });

    window.zoomChartIn = () => { tempChart.zoom(1.1); };
    window.zoomChartOut = () => { tempChart.zoom(0.9); };
    window.resetChartZoom = () => { tempChart.resetZoom(); };

    onValue(ref(db, 'robotek/'), (snapshot) => {
      const data = snapshot.val();
      
      if (!data) {
        setControlsState(false);
        return;
      }
      
      setControlsState(true);
      const controle = data.controle || {};

      systemIsOn = controle.status_sistema || false;
      const statusBtn = document.getElementById('status-btn');
      statusBtn.innerText = systemIsOn ? "SISTEMA ON" : "SISTEMA OFF";
      statusBtn.className = systemIsOn ? "badge-on sys-ctrl" : "badge-off sys-ctrl";

      globalTimerRunning = controle.timer_running || false;
      globalTimerTarget = controle.timer_target || 0;
      
      if (!globalTimerRunning) renderTimerVisuals();

      if (systemIsOn && globalTimerTarget > 0 && !globalTimerRunning) {
        if (Math.abs(tempAtualGlobal - setpointGlobal) <= 5) {
          if (!hasReachedSetpoint) {
            hasReachedSetpoint = true; 
            window.toggleTimerFirebase(); 
          }
        }
      }
      if (!systemIsOn) hasReachedSetpoint = false;
    });

    window.toggleSystem = () => { 
      if (!isEspConnected) return;
      update(ref(db, 'robotek/controle'), { status_sistema: !systemIsOn }); 
    };
    
    document.getElementById('setpoint-range').oninput = (e) => { 
      if (!isEspConnected) return;
      update(ref(db, 'robotek/controle'), { setpoint: parseFloat(e.target.value) }); 
    };
    
    window.adjustSetpoint = (delta) => {
      if (!isEspConnected) return;
      const v = parseFloat(document.getElementById('setpoint-range').value) + delta;
      update(ref(db, 'robotek/controle'), { setpoint: Math.max(20, Math.min(95, v)) });
    };
    
    window.emergencyStop = () => { 
      if (!isEspConnected) return;
      update(ref(db, 'robotek/controle'), { status_sistema: false, timer_running: false }); 
    };
  </script>
</body>
</html>
